<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Step 2 – Select Product — SpinBot Portal</title>
<link rel="icon" type="image/png" href="images/image.png"/>
<link rel="shortcut icon" href="images/image.png"/>
<link rel="apple-touch-icon" href="images/image.png"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap"/>
<link rel="stylesheet" href="css/common.css?v=30.0.0"/>
<link rel="stylesheet" href="css/user.css?v=30.0.0"/>
<style>
  :root {
    --g-bg: #ffffff;
    --g-surface: #f8f9fa;
    --g-border: #dadce0;
    --g-text-dark: #202124;
    --g-text-sub: #5f6368;
    --spin-lime: #76D300;
    --spin-lime-dark: #5eb000;
  }

  * { box-sizing: border-box; }

  body {
    background-color: var(--g-surface);
    color: var(--g-text-dark);
    font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    margin: 0;
    padding-bottom: 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* Google Style Header */
  .g-header {
    background: #ffffff;
    border-bottom: 1px solid var(--g-border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .g-header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .g-header-brand img {
    height: 36px;
    width: auto;
  }

  .g-header-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--g-text-sub);
    border-left: 1px solid var(--g-border);
    padding-left: 12px;
  }

  /* Main Container */
  .g-container {
    max-width: 820px;
    margin: 32px auto 0;
    padding: 0 16px;
  }

  .g-card {
    background: #ffffff;
    border: 1px solid var(--g-border);
    border-radius: 24px;
    padding: 36px 32px;
    box-shadow: 0 1px 3px rgba(60,64,67,0.12);
  }

  .g-step-tag {
    font-size: 12px;
    font-weight: 500;
    color: #1a73e8;
    background: #e8f0fe;
    padding: 4px 12px;
    border-radius: 12px;
    display: inline-block;
    margin-bottom: 12px;
  }

  .g-heading {
    font-size: 24px;
    font-weight: 400;
    color: var(--g-text-dark);
    margin: 0 0 6px;
  }

  .g-sub {
    font-size: 14px;
    color: var(--g-text-sub);
    margin: 0 0 24px;
  }

  /* Filter Chips */
  .g-cat-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .g-chip {
    font-size: 13px;
    font-weight: 500;
    padding: 6px 16px;
    border-radius: 18px;
    border: 1px solid var(--g-border);
    background: #ffffff;
    color: var(--g-text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }

  .g-chip:hover {
    background: var(--g-surface);
    color: var(--g-text-dark);
  }

  .g-chip.active {
    background: var(--spin-lime);
    color: #0f172a;
    border-color: var(--spin-lime);
    font-weight: 600;
  }

  /* Search Input */
  .g-search-box {
    position: relative;
    margin-bottom: 20px;
  }

  .g-search-box input {
    width: 100%;
    height: 48px;
    padding: 10px 16px 10px 44px;
    border: 1px solid var(--g-border);
    border-radius: 24px;
    font-size: 14px;
    color: var(--g-text-dark);
    outline: none;
    background: var(--g-surface);
    transition: all 0.2s;
  }

  .g-search-box input:focus {
    background: #ffffff;
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
  }

  .g-search-box svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--g-text-sub);
  }

  /* Product Selection List */
  .g-product-list {
    border: 1px solid var(--g-border);
    border-radius: 16px;
    max-height: 480px;
    overflow-y: auto;
    background: #ffffff;
    padding: 8px;
  }

  .g-product-item {
    padding: 14px 16px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: background 0.15s ease;
    border: 1px solid transparent;
    margin-bottom: 4px;
  }

  .g-product-item:hover {
    background: var(--g-surface);
    border-color: var(--g-border);
  }

  .g-product-item.selected {
    background: var(--spin-lime-light);
    border-color: rgba(118,211,0,0.5);
  }

  .g-product-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .g-product-name {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--g-text-dark);
  }

  .g-product-sku {
    font-size: 12px;
    color: var(--g-text-sub);
    font-family: monospace;
  }

  .g-product-warranty {
    font-size: 12px;
    font-weight: 500;
    color: #137333;
    background: #e6f4ea;
    padding: 3px 8px;
    border-radius: 8px;
  }

  /* Selected Product Preview Card */
  .g-selected-preview {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: var(--spin-lime-light);
    border: 1px solid rgba(118,211,0,0.5);
    border-radius: 16px;
    padding: 16px 20px;
    margin-top: 20px;
  }

  .g-selected-preview.show { display: flex; }

  .btn-g-nav {
    height: 40px;
    border-radius: 20px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
  }

  .btn-g-next {
    background: var(--spin-lime);
    color: #0f172a;
    border: none;
  }

  .btn-g-next:hover {
    background: var(--spin-lime-dark);
    color: #ffffff;
  }

  .btn-g-back {
    background: transparent;
    color: var(--g-text-sub);
    border: 1px solid var(--g-border);
  }

  .btn-g-back:hover {
    background: var(--g-surface);
    color: var(--g-text-dark);
  }
</style>
</head>
<body>

<!-- Header -->
<header class="g-header">
  <a href="index.html" class="g-header-brand">
    <img src="images/image.png" alt="SpinBot Logo" style="height: 36px; width: auto; max-width: 140px; object-fit: contain;"/>
    <span class="g-header-title">Product Registration</span>
  </a>

  <a href="profile.html" class="btn-g-back" style="padding: 6px 14px; font-size: 13px;">
    <span>My Profile</span>
  </a>
</header>

<div class="g-container">
  <div class="g-card">
    <div class="g-step-tag">Step 2 of 3 — Select Product</div>
    <h1 class="g-heading">Select your SpinBot product</h1>
    <p class="g-sub">Choose the product model you purchased to activate manufacturer warranty</p>

    <!-- Category Chips -->
    <div class="g-cat-chips" id="catTabs"></div>

    <!-- Search Input -->
    <div class="g-search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search product name or SKU..." oninput="handleSearch(this.value)"/>
    </div>

    <!-- Product List -->
    <div class="g-product-list" id="productDropdown">
      <div style="padding: 20px; text-align: center; color: var(--g-text-sub);">Loading products...</div>
    </div>

    <!-- Selected Chip Preview -->
    <div class="g-selected-preview" id="selectedChip">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: 10px; background: #ffffff; display: flex; align-items: center; justify-content: center; border: 1px solid var(--g-border);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5eb000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </div>
        <div>
          <div id="chipTitle" style="font-weight: 500; font-size: 14.5px; color: var(--g-text-dark);"></div>
          <div id="chipSub" style="font-size: 12px; color: var(--g-text-sub);"></div>
        </div>
      </div>
      <button onclick="clearSelection()" style="background: none; border: none; font-size: 13px; color: var(--g-text-sub); cursor: pointer;">
        Clear
      </button>
    </div>

    <div id="selectError" style="display: none; color: #c5221f; font-size: 13px; margin-top: 10px;">
      Please select a product to proceed.
    </div>

    <!-- Buttons -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 28px; padding-top: 16px; border-top: 1px solid #f1f3f4;">
      <a href="index.html" class="btn-g-nav btn-g-back">Back</a>
      <button class="btn-g-nav btn-g-next" onclick="proceedToStep3()">
        <span>Next Step</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module">
  import { getProducts } from './js/db-service.js?v=33.0.0';

  const FALLBACK_PRODUCTS = [
    { id: "prod_seed_1", name: "SpinBot IceDot Mag v1 Mobile Cooler", sku: "SB-ICEDOT-MAG1", brand: "SpinBot", warrantyPeriod: "12 Months", status: "Active", category: "Coolers" },
    { id: "prod_seed_2", name: "SpinBot BattleMods Apex Gaming Trigger", sku: "SB-BM-APEX", brand: "SpinBot", warrantyPeriod: "6 Months", status: "Active", category: "Gaming Triggers" },
    { id: "prod_seed_3", name: "SpinBot BattleBudz C10 Type-C Earphone", sku: "SB-BB-C10", brand: "SpinBot", warrantyPeriod: "12 Months", status: "Active", category: "Earphones & Headphones" },
    { id: "prod_seed_4", name: "SpinBot Airflow X10 Laptop Cooling Pad", sku: "SB-AF-X10", brand: "SpinBot", warrantyPeriod: "12 Months", status: "Active", category: "Laptop Cooling" },
    { id: "prod_seed_5", name: "SpinBot Rage MK87 Mechanical Keyboard", sku: "SB-MK87", brand: "SpinBot", warrantyPeriod: "24 Months", status: "Active", category: "Keyboards" },
    { id: "prod_seed_6", name: "SpinBot HX500 Gaming Headset", sku: "SB-HX500", brand: "SpinBot", warrantyPeriod: "12 Months", status: "Active", category: "Earphones & Headphones" }
  ];

  let products = [];
  let isLoadingProducts = true;
  let selectedProduct = null;
  let activeCategory = 'All';
  let searchQuery = '';

  const savedObj = sessionStorage.getItem('sb_product_obj') || localStorage.getItem('sb_product_obj');
  const savedName = sessionStorage.getItem('sb_product') || localStorage.getItem('sb_product');
  if (savedObj) {
    try { selectedProduct = JSON.parse(savedObj); } catch(e) {}
  } else if (savedName) {
    selectedProduct = { name: savedName, sku: 'N/A', warrantyPeriod: '12 Months' };
  }

  async function loadProducts() {
    isLoadingProducts = true;
    renderDropdown();
    try {
      const res = await getProducts();
      if (Array.isArray(res)) {
        products = res;
      }
    } catch (e) {
      console.warn('Error loading products:', e);
    } finally {
      isLoadingProducts = false;
      renderTabs();
      renderDropdown();
      if (selectedProduct) updateChipUI();
    }
  }

  function normalizeCategory(cat) {
    if (!cat) return 'General';
    const c = String(cat).trim();
    const lower = c.toLowerCase();
    if (lower.includes('mousepad')) return 'Gaming Mousepads';
    if (lower.includes('trigger')) return 'Gaming Triggers';
    if (lower.includes('laptop')) return 'Laptop Cooling';
    if (lower.includes('earphone') || lower.includes('headphone') || lower.includes('headset') || lower.includes('battlebudz') || lower.includes('ranger')) return 'Earphones & Headphones';
    if (lower.includes('cooler')) return 'Coolers';
    if (lower.includes('keyboard')) return 'Keyboards';
    if (lower.includes('mouse')) return 'Gaming Mice';
    if (lower.includes('sleeve')) return 'Finger Sleeves';
    if (lower.includes('controller') || lower.includes('gamepad') || lower.includes('arcade')) return 'Controllers & Gamepads';
    return c;
  }

  function renderTabs() {
    const el = document.getElementById('catTabs');
    if (!el) return;
    if (isLoadingProducts) {
      el.innerHTML = `<span style="font-size:12px; color: var(--g-text-sub);">Loading categories...</span>`;
      return;
    }
    const rawCats = products.map(p => normalizeCategory(p.category));
    const cats = ['All', ...new Set(rawCats)];
    el.innerHTML = cats.map(c => 
      `<button class="g-chip ${c === activeCategory ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>`
    ).join('');
  }

  function renderDropdown() {
    const dd = document.getElementById('productDropdown');
    if (!dd) return;

    if (isLoadingProducts) {
      dd.innerHTML = `
        <div style="padding: 28px; text-align: center; color: var(--g-text-sub); font-size: 13px;">
          <div style="display: inline-block; width: 22px; height: 22px; border: 2.5px solid #1a73e8; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px;"></div>
          <div>Loading products catalog...</div>
        </div>
      `;
      return;
    }

    const filtered = products.filter(p => {
      const normCat = normalizeCategory(p.category);
      const matchCat = activeCategory === 'All' || normCat === activeCategory;
      const q = searchQuery.toLowerCase();
      const matchQ = !q || (p.name && p.name.toLowerCase().includes(q)) || (p.sku && p.sku.toLowerCase().includes(q));
      return matchCat && matchQ;
    });

    if (filtered.length === 0) {
      dd.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--g-text-sub); font-size: 13.5px;">No products match your search/category criteria (${products.length} total products loaded).</div>`;
      return;
    }

    dd.innerHTML = `
      <div style="padding: 6px 12px 10px; font-size: 12px; color: var(--g-text-sub); font-weight: 500; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed var(--g-border); margin-bottom: 6px;">
        <span>Showing <strong>${filtered.length}</strong> of <strong>${products.length}</strong> SpinBot products</span>
        <span style="color: #137333; font-weight: 600;">✓ Ready for warranty activation</span>
      </div>
      ` + filtered.map(p => {
      const isSel = selectedProduct && (selectedProduct.sku === p.sku || selectedProduct.name === p.name || selectedProduct.id === p.id);
      const imgSrc = p.image || p.productImage;
      return `
        <div class="g-product-item ${isSel ? 'selected' : ''}" onclick="selectProd('${p.id}')">
          <div class="g-product-info">
            <div style="width: 38px; height: 38px; border-radius: 8px; background: #f8f9fa; border: 1px solid #e2e8f0; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              ${imgSrc ? `<img src="${imgSrc}" alt="${p.name}" style="width: 100%; height: 100%; object-fit: cover;"/>` : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#76D300" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>`}
            </div>
            <div>
              <div class="g-product-name">${p.name}</div>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
                <span class="g-product-sku">SKU: ${p.sku || 'N/A'}</span>
                <span style="font-size: 11px; background: #f1f5f9; color: #475569; padding: 1px 6px; border-radius: 4px; font-weight: 500;">${normalizeCategory(p.category)}</span>
              </div>
            </div>
          </div>
          <span class="g-product-warranty">${p.warrantyPeriod || '12 Months'} Warranty</span>
        </div>
      `;
    }).join('');
  }

  window.filterCat = (cat) => {
    activeCategory = cat;
    renderTabs();
    renderDropdown();
  };

  window.handleSearch = (val) => {
    searchQuery = val;
    renderDropdown();
  };

  window.selectProd = (id) => {
    const p = products.find(prod => prod.id === id);
    if (p) {
      selectedProduct = p;
      sessionStorage.setItem('sb_product', p.name);
      sessionStorage.setItem('sb_product_obj', JSON.stringify(p));
      localStorage.setItem('sb_product', p.name);
      localStorage.setItem('sb_product_obj', JSON.stringify(p));
      updateChipUI();
      renderDropdown();
      document.getElementById('selectError').style.display = 'none';
    }
  };

  window.clearSelection = () => {
    selectedProduct = null;
    sessionStorage.removeItem('sb_product');
    sessionStorage.removeItem('sb_product_obj');
    localStorage.removeItem('sb_product');
    localStorage.removeItem('sb_product_obj');
    document.getElementById('selectedChip').classList.remove('show');
    renderDropdown();
  };

  function updateChipUI() {
    if (!selectedProduct) return;
    document.getElementById('chipTitle').innerText = selectedProduct.name;
    document.getElementById('chipSub').innerText = `SKU: ${selectedProduct.sku || 'N/A'} • ${selectedProduct.warrantyPeriod || '12 Months'} Warranty`;
    document.getElementById('selectedChip').classList.add('show');
  }

  window.proceedToStep3 = () => {
    if (!selectedProduct) {
      document.getElementById('selectError').style.display = 'block';
      return;
    }
    window.location.href = 'step3-details.html';
  };

  loadProducts();
</script>
</body>
</html>
