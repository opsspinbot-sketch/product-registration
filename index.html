<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SpinBot Warranty Portal — Sign In</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap"/>
<link rel="stylesheet" href="css/common.css?v=26.0.0"/>
<link rel="stylesheet" href="css/user.css?v=26.0.0"/>
<style>
  :root {
    --g-bg: #ffffff;
    --g-surface: #f8f9fa;
    --g-border: #dadce0;
    --g-text-dark: #202124;
    --g-text-sub: #5f6368;
    --spin-lime: #76D300;
    --spin-lime-dark: #5eb000;
    --spin-lime-light: #f3fcdd;
  }

  * {
    box-sizing: border-box;
  }

  body {
    background-color: var(--g-surface);
    color: var(--g-text-dark);
    font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    margin: 0;
    padding-bottom: 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* Google Style Header */
  .g-header {
    background: #ffffff;
    border-bottom: 1px solid var(--g-border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .g-header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .g-header-brand img {
    height: 36px;
    width: auto;
    object-fit: contain;
  }

  .g-header-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--g-text-sub);
    border-left: 1px solid var(--g-border);
    padding-left: 12px;
  }

  .g-header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lookup-btn {
    background: transparent;
    color: var(--g-text-dark);
    font-size: 13.5px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid var(--g-border);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }

  .lookup-btn:hover {
    background: var(--g-surface);
  }

  /* Main Container Card */
  .g-card-container {
    max-width: 520px;
    margin: 40px auto 0;
    padding: 0 16px;
  }

  .g-auth-card {
    background: #ffffff;
    border: 1px solid var(--g-border);
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 1px 3px rgba(60,64,67,0.12), 0 4px 12px rgba(60,64,67,0.08);
  }

  .g-auth-logo {
    text-align: center;
    margin-bottom: 20px;
  }

  .g-auth-logo img {
    height: 42px;
    width: auto;
  }

  .g-auth-heading {
    font-size: 24px;
    font-weight: 400;
    color: var(--g-text-dark);
    text-align: center;
    margin: 0 0 8px;
  }

  .g-auth-sub {
    font-size: 14px;
    color: var(--g-text-sub);
    text-align: center;
    margin: 0 0 28px;
  }

  /* Google Sign-In Pill Button */
  .btn-google-signin {
    width: 100%;
    height: 48px;
    border-radius: 24px;
    background: #ffffff;
    color: #3c4043;
    border: 1px solid #dadce0;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    transition: background-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 1px 2px rgba(60,64,67,0.08);
  }

  .btn-google-signin:hover {
    background-color: #f8f9fa;
    border-color: #d2e3fc;
    box-shadow: 0 1px 3px rgba(60,64,67,0.15);
  }

  .g-divider {
    display: flex;
    align-items: center;
    margin: 22px 0;
    color: #70757a;
    font-size: 12px;
    font-weight: 500;
  }

  .g-divider::before, .g-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--g-border);
  }

  .g-divider span {
    padding: 0 12px;
  }

  /* Material Form Inputs */
  .g-input-group {
    margin-bottom: 16px;
  }

  .g-input-group label {
    font-size: 13px;
    font-weight: 500;
    color: var(--g-text-dark);
    margin-bottom: 6px;
    display: block;
  }

  .g-input {
    width: 100%;
    height: 44px;
    padding: 10px 14px;
    border: 1px solid var(--g-border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--g-text-dark);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .g-input:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
  }

  .btn-g-submit {
    width: 100%;
    height: 44px;
    border-radius: 22px;
    background: var(--spin-lime);
    color: #0f172a;
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .btn-g-submit:hover {
    background: var(--spin-lime-dark);
    color: #ffffff;
  }

  .g-footer-note {
    font-size: 12px;
    color: var(--g-text-sub);
    text-align: center;
    margin-top: 24px;
  }
</style>
</head>
<body>

<!-- Google Style Header -->
<header class="g-header">
  <a href="index.html" class="g-header-brand">
    <img src="images/download.png" alt="SpinBot Logo"/>
    <span class="g-header-title">Warranty Portal</span>
  </a>

  <div class="g-header-actions">
    <div id="headerProfileBtn"></div>
    <button class="lookup-btn" onclick="openLookupModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Check Status</span>
    </button>
  </div>
</header>

<!-- Main Container -->
<div class="g-card-container">
  <div class="g-auth-card">
    <div class="g-auth-logo">
      <img src="images/download.png" alt="SpinBot Care Desk"/>
    </div>

    <h1 class="g-auth-heading">Sign in to SpinBot</h1>
    <p class="g-auth-sub">Activate &amp; manage your SpinBot device warranties</p>

    <div id="authButtonContainer">
      <!-- Google Sign-In -->
      <button id="btnGoogleAuth" onclick="handleCustomerGoogleAuth()" class="btn-google-signin">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Sign in with Google</span>
      </button>

      <div class="g-divider">
        <span>or sign in with email</span>
      </div>

      <!-- Email Login Form -->
      <form onsubmit="handleCustomerEmailAuth(event)">
        <div class="g-input-group">
          <label for="loginEmailInput">Email address</label>
          <input type="email" id="loginEmailInput" class="g-input" placeholder="you@example.com" required/>
        </div>

        <button type="submit" id="btnEmailAuth" class="btn-g-submit">
          Continue with Email
        </button>
      </form>
    </div>

    <div class="g-footer-note">
      Protected by SpinBot Care Desk • <a href="mailto:support@spinbot.co.in" style="color: #1a73e8; text-decoration: none;">Support</a>
    </div>
  </div>
</div>

<!-- First Time User Welcome Profile Modal (Google Material Dialog) -->
<div id="firstTimeUserModal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(32,33,36,0.6); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
  <div style="background: #ffffff; border-radius: 24px; max-width: 440px; width: 100%; padding: 32px 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border: 1px solid var(--g-border);">
    
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 style="font-size: 20px; font-weight: 500; color: var(--g-text-dark); margin: 0 0 4px;">Set up your profile</h2>
      <p style="font-size: 13px; color: var(--g-text-sub); margin: 0;">Enter your name to complete your SpinBot account</p>
    </div>

    <div class="g-input-group">
      <label style="font-size: 13px; font-weight: 500; color: var(--g-text-dark); margin-bottom: 6px; display: block;">Full Name</label>
      <input type="text" id="custNameInput" class="g-input" placeholder="Enter your full name (alphabets only)" pattern="[A-Za-z\s]+" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')"/>
    </div>

    <div class="g-input-group">
      <label style="font-size: 13px; font-weight: 500; color: var(--g-text-dark); margin-bottom: 6px; display: block;">Email Address</label>
      <input type="email" id="custEmailInput" class="g-input" readonly style="background: var(--g-surface); color: var(--g-text-sub);"/>
    </div>

    <button id="btnSaveProfile" onclick="submitCustomerProfile()" class="btn-g-submit" style="margin-top: 8px;">
      Save &amp; Continue
    </button>
  </div>
</div>

<!-- Lookup Status Modal -->
<div id="lookupModal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(32,33,36,0.6); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
  <div style="background: #ffffff; border-radius: 24px; max-width: 460px; width: 100%; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border: 1px solid var(--g-border);">
    
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <h3 style="font-size: 18px; font-weight: 500; color: var(--g-text-dark); margin: 0;">Check Registration Status</h3>
      <button onclick="closeLookupModal()" style="background: none; border: none; font-size: 20px; color: var(--g-text-sub); cursor: pointer;">&times;</button>
    </div>

    <div class="g-input-group">
      <label style="font-size: 13px; font-weight: 500; color: var(--g-text-dark); margin-bottom: 6px; display: block;">Registration ID or Email</label>
      <input type="text" id="lookupQueryInput" class="g-input" placeholder="e.g. SB-10492 or your email"/>
    </div>

    <button onclick="performStatusLookup()" class="btn-g-submit">
      Search Status
    </button>

    <div id="lookupResultContainer" style="margin-top: 16px;"></div>
  </div>
</div>

<script type="module">
  import { showToast } from './js/ui-components.js?v=24.0.0';
  import { loginCustomerWithGoogle, loginCustomerWithEmail, getCustomerSession, createOrSaveCustomerProfile } from './js/auth-service.js?v=24.0.0';
  import { getRegistrations } from './js/db-service.js?v=24.0.0';

  window.handleCustomerGoogleAuth = async () => {
    const btn = document.getElementById('btnGoogleAuth');
    if (btn) btn.disabled = true;
    try {
      const res = await loginCustomerWithGoogle();
      if (res && res.isFirstTime) {
        openFirstTimeModal(res.tempProfile || res.profile);
      } else {
        showToast('Signed in successfully!', 'success');
        setTimeout(() => window.location.href = 'profile.html', 400);
      }
    } catch (e) {
      showToast('Authentication cancelled or failed', 'error');
    } finally {
      if (btn) btn.disabled = false;
    }
  };

  window.handleCustomerEmailAuth = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const emailInput = document.getElementById('loginEmailInput');
    const email = emailInput ? emailInput.value.trim() : '';
    if (!email || !email.includes('@')) {
      showToast('Please enter a valid email address', 'warning');
      return;
    }

    const btn = document.getElementById('btnEmailAuth');
    if (btn) btn.disabled = true;

    try {
      const res = await loginCustomerWithEmail(email);
      showToast('Signed in successfully!', 'success');
      setTimeout(() => window.location.href = 'profile.html', 400);
    } catch (e) {
      showToast('Email sign-in failed', 'error');
    } finally {
      if (btn) btn.disabled = false;
    }
  };

  function openFirstTimeModal(tempProfile) {
    const modal = document.getElementById('firstTimeUserModal');
    const nameIn = document.getElementById('custNameInput');
    const emailIn = document.getElementById('custEmailInput');

    if (nameIn) nameIn.value = tempProfile.fullName || tempProfile.name || '';
    if (emailIn) emailIn.value = tempProfile.email || '';
    if (modal) modal.style.display = 'flex';
  }

  window.submitCustomerProfile = async () => {
    const nameIn = document.getElementById('custNameInput');
    const emailIn = document.getElementById('custEmailInput');
    const fullName = nameIn ? nameIn.value.trim() : '';
    const email = emailIn ? emailIn.value.trim() : '';

    if (!fullName || !/^[a-zA-Z\s]+$/.test(fullName)) {
      showToast('Please enter a valid full name using alphabets only', 'warning');
      if (nameIn) nameIn.focus();
      return;
    }

    try {
      const current = getCustomerSession() || {};
      const updated = { ...current, fullName, name: fullName, email };
      await createOrSaveCustomerProfile(updated);
      showToast('Profile saved successfully!', 'success');
      setTimeout(() => window.location.href = 'profile.html', 400);
    } catch (e) {
      showToast('Error saving profile', 'error');
    }
  };

  window.openLookupModal = () => {
    document.getElementById('lookupModal').style.display = 'flex';
  };

  window.closeLookupModal = () => {
    document.getElementById('lookupModal').style.display = 'none';
  };

  window.performStatusLookup = async () => {
    const query = document.getElementById('lookupQueryInput').value.trim().toLowerCase();
    const container = document.getElementById('lookupResultContainer');

    if (!query) {
      showToast('Please enter a Registration ID or Email', 'warning');
      return;
    }

    try {
      container.innerHTML = '<div style="font-size:13px; color:var(--g-text-sub);">Searching...</div>';
      const regs = await getRegistrations();
      const match = regs.find(r => (r.warrantyId && r.warrantyId.toLowerCase() === query) || (r.email && r.email.toLowerCase() === query));

      if (match) {
        container.innerHTML = `
          <div style="background: var(--g-surface); border: 1px solid var(--g-border); border-radius: 14px; padding: 16px; font-size: 13px;">
            <div style="font-weight: 500; font-size: 14.5px; color: var(--g-text-dark); margin-bottom: 4px;">${match.product || 'SpinBot Product'}</div>
            <div style="color: var(--g-text-sub); margin-bottom: 4px;">Registration ID: <strong>${match.warrantyId}</strong></div>
            <div style="color: #137333; font-weight: 500; margin-bottom: 12px;">Status: Active Warranty Coverage</div>
            <a href="success.html?id=${encodeURIComponent(match.warrantyId || '')}" style="display: block; width: 100%; text-align: center; background: #1a73e8; color: #ffffff; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 18px; text-decoration: none;">
              View Warranty Ticket &rarr;
            </a>
          </div>
        `;
      } else {
        container.innerHTML = `<div style="font-size:13px; color:#c5221f;">No active registration found for "${query}"</div>`;
      }
    } catch (e) {
      container.innerHTML = `<div style="font-size:13px; color:#c5221f;">Error performing lookup</div>`;
    }
  };

  // Header Session Check
  (function checkHeaderSession() {
    const sess = getCustomerSession();
    const btnContainer = document.getElementById('headerProfileBtn');
    if (sess && btnContainer) {
      btnContainer.innerHTML = `
        <a href="profile.html" style="background: var(--g-surface); border: 1px solid var(--g-border); color: var(--g-text-dark); font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 18px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
          <span>My Profile</span>
        </a>
      `;
    }
  })();
</script>
</body>
</html>
